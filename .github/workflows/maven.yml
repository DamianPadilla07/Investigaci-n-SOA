name: CI Spring Boot

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BikeStoreAsync

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Dar permisos a Maven Wrapper
      run: chmod +x mvnw

    - name: Build & Test
      run: ./mvnw clean verify

    - name: Package Application
      run: ./mvnw package
